AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Image metadata extraction pipeline

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 512

Resources:
  # S3 Bucket (with proper notification configuration)
  ImageBucket:
    Type: AWS::S3::Bucket
    DependsOn: IngestFunctionPermission  # CRITICAL: Wait for permission first
    Properties:
      BucketName: !Sub 'image-pipeline-${AWS::AccountId}-${AWS::Region}'
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt IngestFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/

  # SQS Queue
  ImageQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: image-processing-queue
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600

  # Lambda 1: Ingest Function
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: image-ingest-function
      CodeUri: ingest_function/
      Handler: app.lambda_handler
      Environment:
        Variables:
          QUEUE_URL: !Ref ImageQueue
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'image-pipeline-${AWS::AccountId}-${AWS::Region}'
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImageQueue.QueueName

  # Permission for S3 to invoke Lambda
  IngestFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::image-pipeline-${AWS::AccountId}-${AWS::Region}'

  # Lambda 2: Processor Function
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: image-processor-function
      CodeUri: processor_function/
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET_NAME: !Ref ImageBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'image-pipeline-${AWS::AccountId}-${AWS::Region}'
        - S3WritePolicy:
            BucketName: !Sub 'image-pipeline-${AWS::AccountId}-${AWS::Region}'
        - SQSPollerPolicy:
            QueueName: !GetAtt ImageQueue.QueueName
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ImageQueue.Arn
            BatchSize: 1

Outputs:
  BucketName:
    Description: S3 bucket name
    Value: !Ref ImageBucket
  
  QueueURL:
    Description: SQS Queue URL
    Value: !Ref ImageQueue
  
  IngestFunctionArn:
    Description: Ingest Lambda ARN
    Value: !GetAtt IngestFunction.Arn
  
  ProcessorFunctionArn:
    Description: Processor Lambda ARN
    Value: !GetAtt ProcessorFunction.Arn