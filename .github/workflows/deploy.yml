name: Deploy SAM Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install SAM CLI
        run: pip install aws-sam-cli
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
      
      - name: SAM Build
        run: sam build
      
      - name: SAM Deploy
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
      
      - name: Get Stack Outputs
        id: outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name image-pipeline-stack --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          LAMBDA_ARN=$(aws cloudformation describe-stacks --stack-name image-pipeline-stack --query "Stacks[0].Outputs[?OutputKey=='IngestFunctionArn'].OutputValue" --output text)
          echo "BUCKET_NAME=$BUCKET" >> $GITHUB_OUTPUT
          echo "LAMBDA_ARN=$LAMBDA_ARN" >> $GITHUB_OUTPUT
          echo "Bucket: $BUCKET"
          echo "Lambda ARN: $LAMBDA_ARN"
      
      # NEW STEP: Configure S3 notification
      - name: Configure S3 Event Notification
        run: |
          # Add Lambda permission (idempotent - won't fail if already exists)
          aws lambda add-permission \
            --function-name image-ingest-function \
            --principal s3.amazonaws.com \
            --statement-id s3-trigger-$(date +%s) \
            --action lambda:InvokeFunction \
            --source-arn arn:aws:s3:::${{ steps.outputs.outputs.BUCKET_NAME }} \
            --region us-east-2 || true
          
          # Configure S3 notification
          aws s3api put-bucket-notification-configuration \
            --bucket ${{ steps.outputs.outputs.BUCKET_NAME }} \
            --notification-configuration '{
              "LambdaFunctionConfigurations": [{
                "LambdaFunctionArn": "${{ steps.outputs.outputs.LAMBDA_ARN }}",
                "Events": ["s3:ObjectCreated:*"],
                "Filter": {
                  "Key": {
                    "FilterRules": [{
                      "Name": "prefix",
                      "Value": "incoming/"
                    }]
                  }
                }
              }]
            }'
          
          echo "S3 notification configured successfully!"
      
      - name: Verify Deployment
        run: |
          echo "✅ Deployment complete!"
          echo "Bucket: ${{ steps.outputs.outputs.BUCKET_NAME }}"
          echo "Lambda: ${{ steps.outputs.outputs.LAMBDA_ARN }}"
